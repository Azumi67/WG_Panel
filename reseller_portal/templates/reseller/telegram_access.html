{% macro telegram_access(approved,selected,label="Enable Telegram for this reseller") %}<label class="rp-permission-access"><input type="checkbox" role="switch" name="approved" {{'checked' if approved}}> {{label}}</label><input type="hidden" name="telegram_features_present" value="1"><p class="rp-muted">Bot actions also require the matching workspace permission.</p><div class="rp-checks">{% for key,label in telegram_feature_labels.items() %}<label><input type="checkbox" role="switch" name="telegram_features" value="{{key}}" {{'checked' if key in selected}}>{{label}}</label>{% endfor %}</div>{% endmacro %}
