name: Source validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q .
      - run: find . -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - run: find . -name '*.js' -not -path './static/vendor/*' -print0 | xargs -0 -r -n1 node --check
      - run: node tests/test_operation_client.cjs
      - run: python scripts/build_frontend_assets.py --check
      - run: python scripts/build_application_spec.py --check
      - run: python -m unittest discover -s tests -p test_phase2_supervision.py
      - run: python -m pip install cryptography requests pytest pyyaml
      - run: python -m unittest discover -s tests -p test_phase3_telegram.py
      - run: python -m unittest discover -s tests -p test_reseller_bot_reply.py
      - run: python -m pytest -q tests/test_phase7_deployment.py
      - run: docker compose --env-file docker.env.example --profile postgres --profile reseller --profile telegram --profile node config --quiet
  postgres-queue:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wgtest
          POSTGRES_PASSWORD: wgtest
          POSTGRES_DB: wgtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wgtest -d wgtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WG_TEST_POSTGRES_URL: postgresql+psycopg://wgtest:wgtest@127.0.0.1:5432/wgtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'SQLAlchemy>=2.0,<2.1' 'psycopg[binary]>=3.1,<4' pytest cryptography requests
      - run: python -m pytest -q tests/test_phase1_queue.py tests/test_phase1_scopes.py tests/test_concurrency_update.py tests/test_phase4_operations.py tests/test_phase5_security.py tests/test_phase6_backup.py tests/test_phase9_applications.py
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright jinja2 pytest tinycss2 pyyaml cryptography requests 'SQLAlchemy>=2.0,<2.1'
      - run: python -m playwright install --with-deps chromium
      - run: npm install --global typescript@5.8.3 pyright@1.1.405
      - run: python scripts/validate_release.py --js-names --pyright-names
      - run: python -m pytest -q
      - name: Browser regression checks
        run: |
          export PYTHONPATH=.
          export CHROMIUM_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python tests/test_phase8_frontend.py
          python tests/test_peer_ui_repair.py
          python tests/test_developer_ui.py
          python tests/test_phase9_ui.py
          python tests/test_telegram_layout.py
          python tests/test_phase4_history_ui.py
          python tests/test_phase6_backup_ui.py
          python tests/test_workspace_features.py
          python tests/test_reported_layouts.py
          python tests/test_workspace_update_ui.py
          python tests/test_reseller_alignment_ui.py
  backend-startup:
    runs-on: ubuntu-22.04
    env:
      WG_REQUIRE_FLASK_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-postgres.txt
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_backend_modularization.py tests/test_final_decomposition.py
