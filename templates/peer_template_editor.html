<dialog id="peer-template-editor" class="panel-tools template-editor" aria-labelledby="pte-title"><form id="pte-form"><header class="tools-heading"><div><span class="tools-eyebrow">PEER PAGE DESIGN</span><h2 id="pte-title">Make it yours</h2><p>Customize all peer share pages. Preview every change before saving.</p></div><button type="button" class="btn secondary" id="pte-close">Close</button></header><div class="design-starters"><span>Start with a style</span><button type="button" data-peer-starter="professional">Professional</button><button type="button" data-peer-starter="minimal">Minimal</button><button type="button" data-peer-starter="vivid">Vivid</button></div><div class="pte-layout"><div class="pte-controls"><nav class="pte-tabs" aria-label="Design sections"><button type="button" data-pte-tab="identity" aria-pressed="true">Identity</button><button type="button" data-pte-tab="layout" aria-pressed="false">Layout</button><button type="button" data-pte-tab="appearance" aria-pressed="false">Appearance</button><button type="button" data-pte-tab="typography" aria-pressed="false">Typography</button><button type="button" data-pte-tab="content" aria-pressed="false">Content</button><button type="button" data-pte-tab="motion" aria-pressed="false">Motion</button><button type="button" data-pte-tab="notice" aria-pressed="false">Notice</button><button type="button" data-pte-tab="support" aria-pressed="false">Support</button></nav><section data-pte-panel="identity" ><h3>Identity</h3><label>Brand label<input name="brand" maxlength="80"></label><label>Welcome message<input name="welcome_text" maxlength="300"></label><label>Brand icon<select name="icon"><option value="shield">Shield</option><option value="bolt">Bolt</option><option value="globe">Globe</option><option value="network">Network</option><option value="lock">Lock</option></select></label><label>Default theme<select name="theme"><option value="auto">Visitor preference</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Header alignment<select name="hero_align"><option value="left">Left</option><option value="center">Center</option></select></label></section><section data-pte-panel="layout" hidden><h3>Layout</h3><label>Page layout<select name="selected"><option value="default">Default</option><option value="pro">Pro</option><option value="compact">Compact</option><option value="minimal">Minimal</option></select></label><label>Section order<select name="section_order"><option value="usage_first">Usage, then configuration</option><option value="config_first">Configuration, then usage</option></select></label><label>Page width<select name="page_width"><option value="narrow">Focused</option><option value="wide">Wide</option><option value="full">Full</option></select></label><label>Spacing<select name="density"><option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="airy">Airy</option></select></label><label>Usage display<select name="usage_style"><option value="cards">Detailed cards</option><option value="compact">Compact strip</option></select></label></section><section data-pte-panel="appearance" hidden><h3>Appearance</h3><label>Accent palette<select name="accent"><option value="indigo">Indigo</option><option value="rose">Rose</option><option value="amber">Amber</option><option value="teal">Teal</option></select></label><label class="pte-toggle"><input name="custom_colors" type="checkbox"><span class="pte-switch" aria-hidden="true"></span><span>Use custom colors</span></label><div class="pte-pair"><label>Primary<input name="primary_color" type="color"></label><label>Secondary<input name="secondary_color" type="color"></label></div><label>Card surface<select name="surface"><option value="soft">Soft</option><option value="solid">Solid</option><option value="outline">Outline</option></select></label><label>Corners<select name="corners"><option value="square">Square</option><option value="rounded">Rounded</option><option value="pill">Soft</option></select></label><label>Card shadow<select name="shadow"><option value="none">None</option><option value="subtle">Subtle</option><option value="deep">Deep</option></select></label><label>Action buttons<select name="button_style"><option value="solid">Solid</option><option value="soft">Soft</option><option value="outline">Outline</option></select></label><label>Background texture<select name="background_pattern"><option value="none">None</option><option value="grid">Grid</option><option value="dots">Dots</option></select></label></section><section data-pte-panel="typography" hidden><h3>Typography</h3><label>Typeface<select name="font_family"><option value="rounded">Rounded</option><option value="system">System</option><option value="humanist">Humanist</option></select></label><label>Text size<select name="text_size"><option value="small">Small</option><option value="standard">Standard</option><option value="large">Large</option></select></label></section><section data-pte-panel="content" hidden><h3>Content</h3><label class="pte-toggle"><input name="show_apps" type="checkbox"><span class="pte-switch" aria-hidden="true"></span><span>Official app links</span></label><label class="pte-toggle"><input name="show_support" type="checkbox"><span class="pte-switch" aria-hidden="true"></span><span>Support links</span></label><label class="pte-toggle"><input name="show_guide" type="checkbox"><span class="pte-switch" aria-hidden="true"></span><span>Connection guide</span></label><label class="pte-toggle"><input name="show_endpoint" type="checkbox"><span class="pte-switch" aria-hidden="true"></span><span>Endpoint address</span></label><label class="pte-toggle"><input name="show_address" type="checkbox"><span class="pte-switch" aria-hidden="true"></span><span>Client address</span></label><label class="pte-toggle"><input name="show_qr" type="checkbox"><span class="pte-switch" aria-hidden="true"></span><span>QR code</span></label
